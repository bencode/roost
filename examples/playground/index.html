<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground · Roost</title>
    <style>
      :root {
        --bg: #0d1117; --bar: #161b22; --fg: #c9d1d9; --muted: #8b949e; --line: #30363d;
        --accent: #7ee787; --error: #ff7b72; --busy: #e3b341;
        --keyword: #ff7b72; --string: #a5d6ff; --number: #79c0ff; --select: #264f78;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono); }
      button, select { font: inherit; color: inherit; background: none; border: 1px solid var(--line); padding: 1px 8px; cursor: pointer; }
      button:hover, select:hover { border-color: var(--accent); color: var(--accent); }
      select option { background: var(--bar); }
      a { color: var(--muted); }
      a:hover { color: var(--accent); }
      pre { margin: 0; font: inherit; white-space: pre-wrap; word-break: break-word; }

      #boot { padding: 16px; color: var(--muted); }
      #boot b { color: var(--accent); font-weight: normal; }

      .playground {
        display: grid; height: 100vh;
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-columns: 50% 6px 1fr;
      }
      .toolbar, .status { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bar); }
      .toolbar { border-bottom: 1px solid var(--line); }
      .brand { color: var(--accent); margin-right: 8px; }
      .tabs { display: none; gap: 4px; }
      .tabs .on { border-color: var(--accent); color: var(--accent); }
      .source { margin-left: auto; }

      .left { display: grid; grid-template-rows: 62% 6px 1fr; min-height: 0; min-width: 0; }
      .split { background: var(--line); touch-action: none; }
      .split.columns { cursor: col-resize; }
      .split.rows { cursor: row-resize; }
      .split:hover { background: var(--accent); }

      .code { min-height: 0; overflow: hidden; }
      .code .cm-editor { height: 100%; background: var(--bg); color: var(--fg); }
      .code .cm-editor.cm-focused { outline: none; }
      .code .cm-scroller { font-family: var(--mono); line-height: 1.5; }
      .code .cm-content { padding: 8px 0; caret-color: var(--accent); }
      .code .cm-line { padding: 0 12px; }
      .code .cm-cursor { border-left: 2px solid var(--accent); }
      .code .cm-selectionBackground, .code .cm-focused .cm-selectionBackground { background: var(--select); }
      .code .cm-matchingBracket { color: var(--accent); background: none; outline: 1px solid var(--accent); }
      .code .cm-nonmatchingBracket { color: var(--error); background: none; }
      .code .cm-placeholder { color: var(--muted); }
      .tok-keyword { color: var(--keyword); }
      .tok-string { color: var(--string); }
      .tok-number, .tok-bool, .tok-atom { color: var(--number); }
      .tok-comment { color: var(--muted); font-style: italic; }
      .tok-punctuation, .tok-bracket { color: var(--muted); }
      .cm-tooltip { background: var(--bar); color: var(--fg); border: 1px solid var(--line); font-family: var(--mono); }
      .cm-tooltip-autocomplete > ul > li[aria-selected] { background: var(--accent); color: var(--bg); }
      .cm-completionMatchedText { text-decoration: none; color: var(--accent); }

      .repl { display: flex; flex-direction: column; min-height: 0; }
      .log { flex: 1; overflow: auto; padding: 8px 12px; }
      .entry { margin-bottom: 4px; }
      .entry.intro { color: var(--muted); }
      .entry.input { color: var(--accent); }
      .entry.error { color: var(--error); }
      .preview-value { margin: 4px 0; padding: 8px; background: #fff; color: #1f2933; font: 14px/1.45 system-ui, sans-serif; }
      .preview-value .error { color: #c62828; font-family: var(--mono); }
      .input { display: flex; align-items: baseline; border-top: 1px solid var(--line); }
      .prompt { padding-left: 12px; color: var(--accent); white-space: nowrap; }
      .repl-input { flex: 1; max-height: 40vh; overflow: auto; }
      .repl-input .cm-line { padding: 0 8px; }

      .preview { overflow: auto; padding: 16px; background: #fff; color: #1f2933; font: 15px/1.45 system-ui, sans-serif; }
      .preview button { font: inherit; color: inherit; border: 1px solid #c8ced4; background: #f6f7f9; border-radius: 4px; padding: 2px 10px; }
      .preview button:hover { border-color: #2563eb; color: #2563eb; }

      .status { border-top: 1px solid var(--line); color: var(--muted); }
      .status .light { color: var(--muted); }
      .status.ready .light { color: var(--accent); }
      .status.busy .light { color: var(--busy); }
      .status.error .light, .status.error { color: var(--error); }
      .spacer { flex: 1; }

      @media (max-width: 760px) {
        .playground { grid-template-columns: minmax(0, 1fr) !important; }
        .toolbar { flex-wrap: wrap; }
        .toolbar button { white-space: nowrap; }
        .tabs { display: flex; order: 1; width: 100%; }
        .tabs button { flex: 1; }
        .split, .brand, .source { display: none; }
        .left, .preview { grid-column: 1; grid-row: 2; }
        .left { display: flex; flex-direction: column; }
        .left > * { flex: 1; }
        .tab-code .repl, .tab-repl .module, .tab-preview .left, .tab-code .preview, .tab-repl .preview { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="playground">
      <pre id="boot"><b>λ roost playground</b>
  loading Roost and Hoot's interpreter (about 2 MB) …</pre>
    </div>
    <script type="module" src="./main.scm"></script>
  </body>
</html>
