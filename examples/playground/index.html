<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground · Roost</title>
    <style>
      /* Light by default, as paper; dark when the system asks for it. The preview's
         canvas stays white: it shows the module's page as a page. */
      :root {
        color-scheme: light dark;
        --bg: #fbfaf7; --bar: #f2f1ec; --fg: #1f2328; --muted: #656d76; --line: #d8d6cf;
        --control: #a8a59c; --accent: #1a7f37; --error: #cf222e; --busy: #9a6700;
        --select: #d5e3f5;
        --keyword: #8250df; --builtin: #0550ae; --keyword-arg: #1b7c83;
        --string: #0a3069; --number: #953800;
        --paren0: #9a6700; --paren1: #6639ba; --paren2: #0969da; --paren3: #1a7f37;
        --canvas: #ffffff; --canvas-fg: #1f2933;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117; --bar: #161b22; --fg: #c9d1d9; --muted: #8b949e; --line: #30363d;
          --control: #6e7681; --accent: #7ee787; --error: #ff7b72; --busy: #e3b341;
          --select: #264f78;
          --keyword: #d2a8ff; --builtin: #79c0ff; --keyword-arg: #56d4dd;
          --string: #a5d6ff; --number: #ffa657;
          --paren0: #e3b341; --paren1: #d2a8ff; --paren2: #79c0ff; --paren3: #7ee787;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono); caret-color: var(--accent); }
      ::selection { background: var(--select); }
      * { scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button, select { font: inherit; color: inherit; background: none; border: 1px solid var(--control); border-radius: 3px; padding: 1px 10px; cursor: pointer; }
      button:hover, select:hover { border-color: var(--accent); color: var(--accent); }
      select option { background: var(--bar); color: var(--fg); }
      a { color: var(--muted); text-decoration: none; }
      a:hover { color: var(--accent); }
      pre { margin: 0; font: inherit; white-space: pre-wrap; word-break: break-word; }
      kbd { margin-left: 8px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); font: 11px var(--mono); }
      .spacer { flex: 1; }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }

      #boot { padding: 16px; color: var(--muted); }
      #boot b { color: var(--accent); }

      .playground {
        display: grid; height: 100vh;
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-columns: 50% 6px 1fr;
      }

      .toolbar, .status { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bar); }
      .toolbar { border-bottom: 1px solid var(--line); }
      .brand { margin-right: 8px; color: var(--fg); }
      .brand b { color: var(--accent); }
      .toolbar .primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      .toolbar .primary:hover { background: var(--accent); color: var(--bar); }
      .toolbar .primary:hover kbd { color: inherit; border-color: currentColor; }
      .tabs { display: none; gap: 4px; }
      .tabs .on { border-color: var(--accent); color: var(--accent); }
      .source { margin-left: auto; }

      .left { display: grid; grid-template-rows: 62% 6px 1fr; min-height: 0; min-width: 0; }
      /* The handle is 6px to grab and shows as a 1px rule. */
      .split { position: relative; touch-action: none; }
      .split::before { content: ""; position: absolute; background: var(--line); }
      .split.columns { cursor: col-resize; }
      .split.columns::before { top: 0; bottom: 0; left: 2px; width: 1px; }
      .split.rows { cursor: row-resize; }
      .split.rows::before { left: 0; right: 0; top: 2px; height: 1px; }
      .split:hover::before { background: var(--accent); }
      .split.columns:hover::before { left: 2px; width: 2px; }
      .split.rows:hover::before { top: 2px; height: 2px; }

      /* Editors */
      .code { min-height: 0; overflow: hidden; }
      .module:focus-within, .repl:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
      .code .cm-editor { height: 100%; background: var(--bg); color: var(--fg); }
      .code .cm-editor.cm-focused { outline: none; }
      .code .cm-scroller { font-family: var(--mono); line-height: 1.55; }
      .code .cm-content { padding: 10px 0; caret-color: var(--accent); }
      .code .cm-line { padding: 0 14px; }
      .code .cm-cursor { border-left: 2px solid var(--accent); }
      .code .cm-selectionBackground, .code .cm-focused .cm-selectionBackground { background: var(--select); }
      .code .cm-matchingBracket { background: var(--select); outline: 1px solid var(--accent); }
      .code .cm-nonmatchingBracket { color: var(--error); background: none; }
      .code .cm-placeholder { color: var(--muted); }
      .tok-keyword { color: var(--keyword); font-weight: 600; }
      .tok-builtin { color: var(--builtin); }
      .tok-keyword-arg { color: var(--keyword-arg); }
      .tok-string { color: var(--string); }
      .tok-number, .tok-atom { color: var(--number); }
      .tok-comment { color: var(--muted); font-style: italic; }
      .tok-paren0 { color: var(--paren0); }
      .tok-paren1 { color: var(--paren1); }
      .tok-paren2 { color: var(--paren2); }
      .tok-paren3 { color: var(--paren3); }
      .tok-paren0, .tok-paren1, .tok-paren2, .tok-paren3 { opacity: .75; }
      .cm-tooltip { background: var(--bar); color: var(--fg); border: 1px solid var(--line); font-family: var(--mono); }
      .cm-tooltip-autocomplete > ul > li[aria-selected] { background: var(--accent); color: var(--bar); }
      .cm-completionMatchedText { text-decoration: none; color: var(--accent); }

      /* REPL */
      .repl { display: flex; flex-direction: column; min-height: 0; }
      .log { flex: 1; overflow: auto; padding: 8px 14px; }
      .entry { margin-bottom: 6px; }
      .entry.intro { color: var(--muted); }
      .entry-input { color: var(--accent); }
      .entry-error { color: var(--error); }
      .problem { padding: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .problem-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
      .problem-kind { color: var(--error); font-weight: 600; }
      .problem .where { padding: 0 6px; border-color: var(--error); color: var(--error); }
      .problem .where:hover { background: var(--error); color: var(--bg); }
      .problem details { margin-top: 4px; color: var(--muted); }
      .problem summary { cursor: pointer; }
      .problem details pre { margin-top: 4px; font-size: 12px; }
      .problem.resolved { opacity: .5; }
      .problem.resolved .problem-summary { text-decoration: line-through; }
      .preview-value { margin: 4px 0 8px 2ch; padding: 8px 12px; background: var(--canvas); color: var(--canvas-fg); border: 1px solid var(--line); border-left-color: var(--accent); font: 14px/1.45 var(--sans); }
      .preview-value .error { color: #c62828; font-family: var(--mono); }
      .prompt-line { display: flex; align-items: baseline; border-top: 1px solid var(--line); }
      .prompt { padding-left: 14px; color: var(--accent); white-space: nowrap; }
      .repl-input { flex: 1; max-height: 40vh; overflow: auto; }
      .repl-input .cm-line { padding: 0 8px; }

      /* Preview: a labelled canvas for the module's page */
      .preview { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); }
      .preview-bar { display: flex; align-items: center; gap: 8px; padding: 4px 14px; background: var(--bar); border-bottom: 1px solid var(--line); color: var(--muted); }
      .preview-bar .dot { background: var(--accent); }
      .canvas { flex: 1; overflow: auto; padding: 16px; color: var(--canvas-fg); font: 15px/1.45 var(--sans); }
      /* The module's page is a light page in either theme, form controls included. */
      .canvas, .preview-value { color-scheme: light; }
      .canvas button { font: inherit; color: inherit; border: 1px solid #b9c0c7; background: #f6f7f9; border-radius: 4px; padding: 2px 10px; }
      .canvas button:hover { border-color: #2563eb; color: #2563eb; }
      .preview.stale .preview-bar { color: var(--error); }
      .preview.stale .preview-bar .dot { background: var(--error); }
      .preview.stale .canvas { opacity: .45; outline: 1px dashed var(--error); outline-offset: -8px; }

      /* Status */
      .status { border-top: 1px solid var(--line); color: var(--muted); }
      .status.ready .dot { background: var(--accent); }
      .status.busy .dot { background: var(--busy); }
      .status.error .dot { background: var(--error); }
      .status.error .message { color: var(--error); }

      @media (max-width: 760px) {
        .playground { grid-template-columns: minmax(0, 1fr) !important; }
        .toolbar { flex-wrap: wrap; }
        .toolbar button { white-space: nowrap; }
        .tabs { display: flex; order: 1; width: 100%; }
        .tabs button { flex: 1; }
        .split, .brand, .source, kbd { display: none; }
        .left, .preview { grid-column: 1; grid-row: 2; }
        .left { display: flex; flex-direction: column; }
        .left > * { flex: 1; }
        .tab-code .repl, .tab-repl .module, .tab-preview .left, .tab-code .preview, .tab-repl .preview { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="playground">
      <pre id="boot"><b>λ</b> roost/playground
  loading Roost and Hoot's interpreter (about 2 MB) …</pre>
    </div>
    <script type="module" src="./main.scm"></script>
  </body>
</html>
